<title id="sim7-title">Share of simulated markets in which the product with the largest true share also came first in the simulation, for 50, 100, 150, 250, 400 and 1,000 respondents, by the true gap between the two largest products. true gap up to 5 percentage points: 53, 56, 62, 64, 65 and 72 percent; true gap 5 to 10 percentage points: 68, 78, 82, 85, 89 and 96 percent; true gap more than 10 percentage points: 92, 97, 98, 99, 100 and 100 percent.</title>
